name: Build and Push Docker Images

on: []

permissions:
    contents: read
    packages: write

jobs:
    prepare-assets:
        name: Prepare frontend assets
        runs-on: heavy
        steps:
            - uses: actions/checkout@v6

            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Enable corepack
              run: corepack enable && corepack prepare yarn@1.22.22 --activate

            - name: Cache node_modules
              uses: actions/cache@v4
              with:
                  path: ~/.npm
                  key: ${{ runner.os }}-node-${{ hashFiles('**/yarn.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-node-

            - name: Install dependencies
              run: yarn install --frozen-lockfile

            - name: Build assets
              run: yarn build
              env:
                  NODE_ENV: production

            - name: Upload built assets
              uses: actions/upload-artifact@v3
              with:
                  name: assets
                  path: public/build/

    build-web:
        name: Build web image
        needs: prepare-assets
        runs-on: heavy
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@v6

            - name: Download built assets
              uses: actions/download-artifact@v3
              with:
                  name: assets
                  path: public/build/

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4
              with:
                  driver-opts: network=host

            - name: Login to registry
              run: |
                  for i in 1 2 3; do
                      echo "${{ secrets.ORG_TOKEN_DOCKER }}" | docker login forgejo.tailb7c9d.ts.net \
                          --username "${{ secrets.ORG_USERNAME_DOCKER }}" \
                          --password-stdin && break
                      sleep 5
                  done

            - name: Generate minimal .env for build
              run: |
                  cat > .env << 'EOF'
                  APP_ENV=production
                  APP_KEY=base64:dummykeyforbuildpurposesonly
                  APP_DEBUG=false
                  APP_URL=http://localhost
                  DB_CONNECTION=sqlite
                  SESSION_DRIVER=database
                  CACHE_STORE=database
                  QUEUE_CONNECTION=database
                  REDIS_CLIENT=predis
                  LOG_CHANNEL=stack
                  LOG_LEVEL=error
                  EOF
                  cp .env .env.production

            - name: Build and push web (multi-arch)
              env:
                  COMPOSER_AUTH: >-
                      {"http-basic":{"packages.filamentphp.com":{"username":"andrei@danielpetrica.com","password":"${{ secrets.FILAMENT_TOKEN }}"}}}
              uses: docker/build-push-action@v6
              with:
                  context: .
                  secrets: |
                      composer_auth=${{ env.COMPOSER_AUTH }}
                  pull: true
                  target: frankenphp
                  platforms: linux/amd64,linux/arm64
                  labels: |
                      org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
                  cache-from: |
                      type=registry,ref=forgejo.tailb7c9d.ts.net/${{ github.repository_owner }}/danielpetrica.com:web,image-manifest=true
                      type=registry,ref=forgejo.tailb7c9d.ts.net/${{ github.repository_owner }}/danielpetrica.com:web-buildcache,image-manifest=true
                  cache-to: type=registry,ref=forgejo.tailb7c9d.ts.net/${{ github.repository_owner }}/danielpetrica.com:web-buildcache,mode=min
                  tags: |
                      forgejo.tailb7c9d.ts.net/${{ github.repository_owner }}/danielpetrica.com:web
                      forgejo.tailb7c9d.ts.net/${{ github.repository_owner }}/danielpetrica.com:web-${{ github.ref_name }}
                  push: true

    build-worker:
        name: Build worker image
        needs: prepare-assets
        runs-on: heavy
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@v6

            - name: Download built assets
              uses: actions/download-artifact@v3
              with:
                  name: assets
                  path: public/build/

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4
              with:
                  driver-opts: network=host

            - name: Login to registry
              run: |
                  for i in 1 2 3; do
                      echo "${{ secrets.ORG_TOKEN_DOCKER }}" | docker login forgejo.tailb7c9d.ts.net \
                          --username "${{ secrets.ORG_USERNAME_DOCKER }}" \
                          --password-stdin && break
                      sleep 5
                  done

            - name: Generate minimal .env for build
              run: |
                  cat > .env << 'EOF'
                  APP_ENV=production
                  APP_KEY=base64:dummykeyforbuildpurposesonly
                  APP_DEBUG=false
                  APP_URL=http://localhost
                  DB_CONNECTION=sqlite
                  SESSION_DRIVER=database
                  CACHE_STORE=database
                  QUEUE_CONNECTION=database
                  REDIS_CLIENT=predis
                  LOG_CHANNEL=stack
                  LOG_LEVEL=error
                  EOF
                  cp .env .env.production

            - name: Build and push worker (multi-arch)
              env:
                  COMPOSER_AUTH: >-
                      {"http-basic":{"packages.filamentphp.com":{"username":"andrei@danielpetrica.com","password":"${{ secrets.FILAMENT_TOKEN }}"}}}
              uses: docker/build-push-action@v6
              with:
                  context: .
                  secrets: |
                      composer_auth=${{ env.COMPOSER_AUTH }}
                  pull: true
                  target: worker
                  platforms: linux/amd64,linux/arm64
                  labels: |
                      org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
                  cache-from: |
                      type=registry,ref=forgejo.tailb7c9d.ts.net/${{ github.repository_owner }}/danielpetrica.com:worker,image-manifest=true
                      type=registry,ref=forgejo.tailb7c9d.ts.net/${{ github.repository_owner }}/danielpetrica.com:worker-buildcache,image-manifest=true
                  cache-to: type=registry,ref=forgejo.tailb7c9d.ts.net/${{ github.repository_owner }}/danielpetrica.com:worker-buildcache,mode=min
                  tags: |
                      forgejo.tailb7c9d.ts.net/${{ github.repository_owner }}/danielpetrica.com:worker
                      forgejo.tailb7c9d.ts.net/${{ github.repository_owner }}/danielpetrica.com:worker-${{ github.ref_name }}
                  push: true

    deploy:
        name: Deploy to Server
        needs: [build-web, build-worker]
        if: startsWith(github.ref, 'refs/tags/')
        runs-on: light
        timeout-minutes: 10
        steps:
            - name: Deploy via SSH
              env:
                  SSH_HOST: ${{ secrets.DEPLOY_HOST }}
                  SSH_USER: ubuntu
                  SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
              run: |
                  mkdir -p ~/.ssh
                  echo "$SSH_KEY" > ~/.ssh/deploy_key
                  chmod 600 ~/.ssh/deploy_key
                  ssh -o StrictHostKeyChecking=no \
                      -i ~/.ssh/deploy_key \
                      "${SSH_USER}@${SSH_HOST}" \
                      "cd /home/ubuntu/traefik/danielpetrica/prod && ./deploy.sh"
