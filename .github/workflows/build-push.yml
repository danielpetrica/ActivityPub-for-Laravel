name: Build and Push Docker Images

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:

permissions:
    contents: read
    packages: write

jobs:
    build:
        name: ${{ matrix.image }}
        runs-on: ubuntu-latest
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                include:
                    - target: frankenphp
                      image: web
                    - target: worker
                      image: worker

        steps:
            - uses: actions/checkout@v6



            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4
              with:
                  buildkitd-flags: --debug
                  driver-opts: network=host


            - name: Cache dependencies
              uses: actions/cache@v4
              with:
                path: ~/.npm
                key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
                restore-keys: |
                  ${{ runner.os }}-node-

            - uses: docker/login-action@v4
              with:
                  registry: forgejo.tailb7c9d.ts.net
                  username: ${{ secrets.ORG_USERNAME_DOCKER }}
                  password: ${{ secrets.ORG_TOKEN_DOCKER }}

            - name: Generate minimal .env for build
              run: |
                  cat > .env << 'EOF'
                  APP_ENV=production
                  APP_KEY=base64:dummykeyforbuildpurposesonly
                  APP_DEBUG=false
                  APP_URL=http://localhost
                  DB_CONNECTION=sqlite
                  SESSION_DRIVER=database
                  CACHE_STORE=database
                  QUEUE_CONNECTION=database
                  REDIS_CLIENT=predis
                  LOG_CHANNEL=stack
                  LOG_LEVEL=error
                  EOF
                  cp .env .env.production

            - name: Build ${{ matrix.image }}
              env:
                  COMPOSER_AUTH: >-
                      {"http-basic":{"packages.filamentphp.com":{"username":"andrei@danielpetrica.com","password":"${{ secrets.FILAMENT_TOKEN }}"}}}
              run: |
                  docker buildx build \
                      --secret id=composer_auth,env=COMPOSER_AUTH \
                      --target ${{ matrix.target }} \
                      --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
                      --tag forgejo.tailb7c9d.ts.net/${{ github.repository_owner }}/danielpetrica.com:${{ matrix.image }} \
                      --tag forgejo.tailb7c9d.ts.net/${{ github.repository_owner }}/danielpetrica.com:${{ matrix.image }}-${{ github.ref_name }} \
                      --load \
                      .

            - name: Push ${{ matrix.image }}
              run: |
                  docker push forgejo.tailb7c9d.ts.net/${{ github.repository_owner }}/danielpetrica.com:${{ matrix.image }}
                  docker push forgejo.tailb7c9d.ts.net/${{ github.repository_owner }}/danielpetrica.com:${{ matrix.image }}-${{ github.ref_name }}

    deploy:
        name: Deploy to Server
        needs: build
        if: startsWith(github.ref, 'refs/tags/')
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Deploy via SSH
              uses: appleboy/ssh-action@v1.2.5
              with:
                  host: ${{ secrets.DEPLOY_HOST }}
                  username: ubuntu
                  key: ${{ secrets.DEPLOY_SSH_KEY }}
                  script: |
                      cd /home/ubuntu/traefik/danielpetrica/prod && ./deploy.sh
