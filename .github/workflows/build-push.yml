name: Build and Push Docker Images

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:

permissions:
    contents: read
    packages: write

jobs:
    build:
        name: ${{ matrix.image }}
        runs-on: heavy
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                include:
                    - target: frankenphp
                      image: web
                    - target: worker
                      image: worker

        steps:
            - uses: actions/checkout@v6



            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4
              with:
                  driver-opts: network=host

            - uses: docker/login-action@v4
              with:
                  registry: forgejo.tailb7c9d.ts.net
                  username: ${{ secrets.ORG_USERNAME_DOCKER }}
                  password: ${{ secrets.ORG_TOKEN_DOCKER }}

            - name: Generate minimal .env for build
              run: |
                  cat > .env << 'EOF'
                  APP_ENV=production
                  APP_KEY=base64:dummykeyforbuildpurposesonly
                  APP_DEBUG=false
                  APP_URL=http://localhost
                  DB_CONNECTION=sqlite
                  SESSION_DRIVER=database
                  CACHE_STORE=database
                  QUEUE_CONNECTION=database
                  REDIS_CLIENT=predis
                  LOG_CHANNEL=stack
                  LOG_LEVEL=error
                  EOF
                  cp .env .env.production

            - name: Build and push ${{ matrix.image }}
              env:
                  COMPOSER_AUTH: >-
                      {"http-basic":{"packages.filamentphp.com":{"username":"andrei@danielpetrica.com","password":"${{ secrets.FILAMENT_TOKEN }}"}}}
              run: |
                  docker buildx build \
                      --secret id=composer_auth,env=COMPOSER_AUTH \
                      --pull \
                      --target ${{ matrix.target }} \
                      --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
                      --cache-from type=registry,ref=forgejo.tailb7c9d.ts.net/${{ github.repository_owner }}/danielpetrica.com:${{ matrix.image }} \
                      --cache-from type=registry,ref=forgejo.tailb7c9d.ts.net/${{ github.repository_owner }}/danielpetrica.com:${{ matrix.image }}-buildcache \
                      --cache-to type=registry,ref=forgejo.tailb7c9d.ts.net/${{ github.repository_owner }}/danielpetrica.com:${{ matrix.image }}-buildcache,mode=max \
                      --tag forgejo.tailb7c9d.ts.net/${{ github.repository_owner }}/danielpetrica.com:${{ matrix.image }} \
                      --tag forgejo.tailb7c9d.ts.net/${{ github.repository_owner }}/danielpetrica.com:${{ matrix.image }}-${{ github.ref_name }} \
                      --push \
                      .

    deploy:
        name: Deploy to Server
        needs: build
        if: startsWith(github.ref, 'refs/tags/')
        runs-on: light
        timeout-minutes: 10
        steps:
            - name: Deploy via SSH
              env:
                  SSH_HOST: ${{ secrets.DEPLOY_HOST }}
                  SSH_USER: ubuntu
                  SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
              run: |
                  mkdir -p ~/.ssh
                  echo "$SSH_KEY" > ~/.ssh/deploy_key
                  chmod 600 ~/.ssh/deploy_key
                  ssh -o StrictHostKeyChecking=no \
                      -i ~/.ssh/deploy_key \
                      "${SSH_USER}@${SSH_HOST}" \
                      "cd /home/ubuntu/traefik/danielpetrica/prod && ./deploy.sh"
