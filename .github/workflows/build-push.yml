            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4
              with:
                  driver-opts: network=host

            - name: Login to registry
              run: |
                  for i in 1 2 3; do
                      echo "${{ secrets.ORG_TOKEN_DOCKER }}" | docker login forgejo.tailb7c9d.ts.net \
                          --username "${{ secrets.ORG_USERNAME_DOCKER }}" \
                          --password-stdin && break
                      sleep 5
                  done

            - name: Generate minimal .env for build
              run: |
                  cat > .env << 'EOF'
                  APP_ENV=production
                  APP_KEY=base64:dummykeyforbuildpurposesonly
                  APP_DEBUG=false
                  APP_URL=http://localhost
                  DB_CONNECTION=sqlite
                  SESSION_DRIVER=database
                  CACHE_STORE=database
                  QUEUE_CONNECTION=database
                  REDIS_CLIENT=predis
                  LOG_CHANNEL=stack
                  LOG_LEVEL=error
                  EOF
                  cp .env .env.production

            - name: Build and push web (arm64)
              env:
                  COMPOSER_AUTH: >-
                      {"http-basic":{"packages.filamentphp.com":{"username":"andrei@danielpetrica.com","password":"${{ secrets.FILAMENT_TOKEN }}"}}}
              uses: docker/build-push-action@v6
              with:
                  context: .
                  secrets: |
                      composer_auth=${{ env.COMPOSER_AUTH }}
                  pull: true
                  target: frankenphp
                  platforms: linux/arm64
                  labels: |
                      org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
                  cache-from: |
                      type=registry,ref=forgejo.tailb7c9d.ts.net/${{ github.repository_owner }}/danielpetrica.com:web-arm64,image-manifest=true
                      type=registry,ref=forgejo.tailb7c9d.ts.net/${{ github.repository_owner }}/danielpetrica.com:web-arm64-buildcache,image-manifest=true
                  cache-to: type=registry,ref=forgejo.tailb7c9d.ts.net/${{ github.repository_owner }}/danielpetrica.com:web-arm64-buildcache,mode=min
                  tags: |
                      forgejo.tailb7c9d.ts.net/${{ github.repository_owner }}/danielpetrica.com:web-arm64
                      forgejo.tailb7c9d.ts.net/${{ github.repository_owner }}/danielpetrica.com:web-arm64-${{ github.ref_name }}
                  push: true

    build-worker-amd64:
        name: worker (amd64)
        needs: prepare-assets
        runs-on: heavy
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@v6

            - name: Download built assets
              uses: actions/download-artifact@v3
              with:
