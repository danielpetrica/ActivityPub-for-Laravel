              uses: docker/build-push-action@v6
              with:
                  context: .
                  secrets: |
                      composer_auth=${{ env.COMPOSER_AUTH }}
                  pull: true
                  target: worker
                  platforms: linux/amd64
                  labels: |
                      org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
                  cache-from: |
                      type=registry,ref=forgejo.tailb7c9d.ts.net/${{ github.repository_owner }}/danielpetrica.com:worker-amd64,image-manifest=true
                      type=registry,ref=forgejo.tailb7c9d.ts.net/${{ github.repository_owner }}/danielpetrica.com:worker-amd64-buildcache,image-manifest=true
                  cache-to: type=registry,ref=forgejo.tailb7c9d.ts.net/${{ github.repository_owner }}/danielpetrica.com:worker-amd64-buildcache,mode=min
                  tags: |
                      forgejo.tailb7c9d.ts.net/${{ github.repository_owner }}/danielpetrica.com:worker-amd64
                      forgejo.tailb7c9d.ts.net/${{ github.repository_owner }}/danielpetrica.com:worker-amd64-${{ github.ref_name }}
                  push: true

