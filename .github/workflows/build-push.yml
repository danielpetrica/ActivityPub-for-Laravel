                  APP_KEY=base64:dummykeyforbuildpurposesonly
                  APP_DEBUG=false
                  APP_URL=http://localhost
                  DB_CONNECTION=sqlite
                  SESSION_DRIVER=database
                  CACHE_STORE=database
                  QUEUE_CONNECTION=database
                  REDIS_CLIENT=predis
                  LOG_CHANNEL=stack
                  LOG_LEVEL=error
                  EOF
                  cp .env .env.production

            - name: Build and push worker (arm64)
              env:
                  COMPOSER_AUTH: >-
                      {"http-basic":{"packages.filamentphp.com":{"username":"andrei@danielpetrica.com","password":"${{ secrets.FILAMENT_TOKEN }}"}}}
              uses: docker/build-push-action@v6
              with:
                  context: .
                  secrets: |
                      composer_auth=${{ env.COMPOSER_AUTH }}
                  pull: true
                  target: worker
                  platforms: linux/arm64
                  labels: |
                      org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
                  cache-from: |
                      type=registry,ref=forgejo.tailb7c9d.ts.net/${{ github.repository_owner }}/danielpetrica.com:worker-arm64,image-manifest=true
                      type=registry,ref=forgejo.tailb7c9d.ts.net/${{ github.repository_owner }}/danielpetrica.com:worker-arm64-buildcache,image-manifest=true
                  cache-to: type=registry,ref=forgejo.tailb7c9d.ts.net/${{ github.repository_owner }}/danielpetrica.com:worker-arm64-buildcache,mode=min
                  tags: |
                      forgejo.tailb7c9d.ts.net/${{ github.repository_owner }}/danielpetrica.com:worker-arm64
                      forgejo.tailb7c9d.ts.net/${{ github.repository_owner }}/danielpetrica.com:worker-arm64-${{ github.ref_name }}
                  push: true

    manifest:
        name: Create multi-arch manifests
        needs: [build-web-amd64, build-web-arm64, build-worker-amd64, build-worker-arm64]
        runs-on: light
        timeout-minutes: 10
        steps:
            - name: Login to registry
              run: |
                  for i in 1 2 3; do
                      echo "${{ secrets.ORG_TOKEN_DOCKER }}" | docker login forgejo.tailb7c9d.ts.net \
                          --username "${{ secrets.ORG_USERNAME_DOCKER }}" \
                          --password-stdin && break
                      sleep 5
                  done

            - name: Create and push multi-arch manifests
              run: |
                  REGISTRY=forgejo.tailb7c9d.ts.net
                  REPO=${{ github.repository_owner }}/danielpetrica.com
                  TAG=${{ github.ref_name }}

                  for IMAGE in web worker; do
                      docker buildx imagetools create \
                          --tag ${REGISTRY}/${REPO}:${IMAGE} \
                          ${REGISTRY}/${REPO}:${IMAGE}-amd64 \
                          ${REGISTRY}/${REPO}:${IMAGE}-arm64

                      docker buildx imagetools create \
                          --tag ${REGISTRY}/${REPO}:${IMAGE}-${TAG} \
                          ${REGISTRY}/${REPO}:${IMAGE}-amd64-${TAG} \
                          ${REGISTRY}/${REPO}:${IMAGE}-arm64-${TAG}
                  done

    deploy:
        name: Deploy to Server
        needs: manifest
        if: startsWith(github.ref, 'refs/tags/')
        runs-on: light
        timeout-minutes: 10
        steps:
            - name: Deploy via SSH
              env:
                  SSH_HOST: ${{ secrets.DEPLOY_HOST }}
                  SSH_USER: ubuntu
                  SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
              run: |
                  mkdir -p ~/.ssh
                  echo "$SSH_KEY" > ~/.ssh/deploy_key
                  chmod 600 ~/.ssh/deploy_key
                  ssh -o StrictHostKeyChecking=no \
                      -i ~/.ssh/deploy_key \
                      "${SSH_USER}@${SSH_HOST}" \
                      "cd /home/ubuntu/traefik/danielpetrica/prod && ./deploy.sh"
