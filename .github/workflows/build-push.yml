            - uses: docker/login-action@v4
              with:
                  registry: forgejo.tailb7c9d.ts.net
                  username: ${{ secrets.ORG_USERNAME_DOCKER }}
                  password: ${{ secrets.ORG_TOKEN_DOCKER }}

            - name: Generate minimal .env for build
              run: |
                  cat > .env << 'EOF'
                  APP_ENV=production
                  APP_KEY=base64:dummykeyforbuildpurposesonly
                  APP_DEBUG=false
                  APP_URL=http://localhost
                  DB_CONNECTION=sqlite
                  SESSION_DRIVER=database
                  CACHE_STORE=database
                  QUEUE_CONNECTION=database
                  REDIS_CLIENT=predis
                  LOG_CHANNEL=stack
                  LOG_LEVEL=error
                  EOF
                  cp .env .env.production

            - name: Build and push worker (amd64)
              env:
                  COMPOSER_AUTH: >-
                      {"http-basic":{"packages.filamentphp.com":{"username":"andrei@danielpetrica.com","password":"${{ secrets.FILAMENT_TOKEN }}"}}}
              run: |
                  IMAGE_BASE=forgejo.tailb7c9d.ts.net/${{ github.repository_owner }}/danielpetrica.com
                  docker buildx build \
                      --secret id=composer_auth,env=COMPOSER_AUTH \
                      --pull \
                      --target worker \
                      --platform linux/amd64 \
                      --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
                      --cache-from type=registry,ref=${IMAGE_BASE}:worker-amd64,image-manifest=true \
                      --cache-from type=registry,ref=${IMAGE_BASE}:worker-amd64-buildcache,image-manifest=true \
                      --cache-to type=registry,ref=${IMAGE_BASE}:worker-amd64-buildcache,mode=min \
                      --tag ${IMAGE_BASE}:worker-amd64 \
                      --tag ${IMAGE_BASE}:worker-amd64-${{ github.ref_name }} \
                      --push \
                      .

    build-worker-arm64:
        name: worker (arm64)
        needs: prepare-assets
        runs-on: heavy
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v6

            - name: Download built assets
              uses: actions/download-artifact@v3
              with:
                  name: assets
                  path: public/build/

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4
              with:
                  driver-opts: network=host

            - uses: docker/login-action@v4
              with:
                  registry: forgejo.tailb7c9d.ts.net
                  username: ${{ secrets.ORG_USERNAME_DOCKER }}
                  password: ${{ secrets.ORG_TOKEN_DOCKER }}

            - name: Generate minimal .env for build
              run: |
                  cat > .env << 'EOF'
                  APP_ENV=production
                  APP_KEY=base64:dummykeyforbuildpurposesonly
                  APP_DEBUG=false
                  APP_URL=http://localhost
                  DB_CONNECTION=sqlite
                  SESSION_DRIVER=database
                  CACHE_STORE=database
                  QUEUE_CONNECTION=database
                  REDIS_CLIENT=predis
                  LOG_CHANNEL=stack
                  LOG_LEVEL=error
                  EOF
                  cp .env .env.production

            - name: Build and push worker (arm64)
              env:
                  COMPOSER_AUTH: >-
                      {"http-basic":{"packages.filamentphp.com":{"username":"andrei@danielpetrica.com","password":"${{ secrets.FILAMENT_TOKEN }}"}}}
              run: |
                  IMAGE_BASE=forgejo.tailb7c9d.ts.net/${{ github.repository_owner }}/danielpetrica.com
                  docker buildx build \
                      --secret id=composer_auth,env=COMPOSER_AUTH \
                      --pull \
                      --target worker \
                      --platform linux/arm64 \
                      --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
                      --cache-from type=registry,ref=${IMAGE_BASE}:worker-arm64,image-manifest=true \
                      --cache-from type=registry,ref=${IMAGE_BASE}:worker-arm64-buildcache,image-manifest=true \
                      --cache-to type=registry,ref=${IMAGE_BASE}:worker-arm64-buildcache,mode=min \
                      --tag ${IMAGE_BASE}:worker-arm64 \
                      --tag ${IMAGE_BASE}:worker-arm64-${{ github.ref_name }} \
                      --push \
                      .

    manifest:
        name: Create multi-arch manifests
        needs: [build-web-amd64, build-web-arm64, build-worker-amd64, build-worker-arm64]
        runs-on: light
        timeout-minutes: 10
        steps:
            - uses: docker/login-action@v4
              with:
                  registry: forgejo.tailb7c9d.ts.net
                  username: ${{ secrets.ORG_USERNAME_DOCKER }}
                  password: ${{ secrets.ORG_TOKEN_DOCKER }}

            - name: Create and push multi-arch manifests
              run: |
                  REGISTRY=forgejo.tailb7c9d.ts.net
                  REPO=${{ github.repository_owner }}/danielpetrica.com
                  TAG=${{ github.ref_name }}

                  for IMAGE in web worker; do
                      docker buildx imagetools create \
                          --tag ${REGISTRY}/${REPO}:${IMAGE} \
                          ${REGISTRY}/${REPO}:${IMAGE}-amd64 \
                          ${REGISTRY}/${REPO}:${IMAGE}-arm64

                      docker buildx imagetools create \
                          --tag ${REGISTRY}/${REPO}:${IMAGE}-${TAG} \
                          ${REGISTRY}/${REPO}:${IMAGE}-amd64-${TAG} \
                          ${REGISTRY}/${REPO}:${IMAGE}-arm64-${TAG}
                  done

    deploy:
        name: Deploy to Server
        needs: manifest
        if: startsWith(github.ref, 'refs/tags/')
        runs-on: light
        timeout-minutes: 10
        steps:
            - name: Deploy via SSH
              env:
                  SSH_HOST: ${{ secrets.DEPLOY_HOST }}
                  SSH_USER: ubuntu
                  SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
              run: |
                  mkdir -p ~/.ssh
                  echo "$SSH_KEY" > ~/.ssh/deploy_key
                  chmod 600 ~/.ssh/deploy_key
                  ssh -o StrictHostKeyChecking=no \
                      -i ~/.ssh/deploy_key \
                      "${SSH_USER}@${SSH_HOST}" \
                      "cd /home/ubuntu/traefik/danielpetrica/prod && ./deploy.sh"
