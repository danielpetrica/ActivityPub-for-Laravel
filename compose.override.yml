# compose.override.yml — Local development overrides
#
# Usage:
#   docker compose -f compose.yml -f compose.override.yml up -d

services:
  danielpetrica_com:
    build:
      context: .
      dockerfile: Dockerfile
      target: frankenphp
      args:
        APP_ENV: ${APP_ENV:-local}
    pull_policy: never
    ports:
      - "8080:80"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
      args:
        APP_ENV: ${APP_ENV:-local}
    pull_policy: never

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
      args:
        APP_ENV: ${APP_ENV:-local}
    pull_policy: never

  db:
    ports:
      - "${DB_EXPOSE_PORT:-15432}:5432"
    volumes:
      - ./.postgres-db/:/var/lib/postgresql

  redis:
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./.redis/redis:/data
