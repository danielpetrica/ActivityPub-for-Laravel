x-env: &default-env
  env_file:
    - .env

x-volumes: &laravel-volumes
  volumes:
    - ./.storage/logs/:/app/storage/logs
    - ./.storage/app/:/app/storage/app
    - ./.storage/framework/:/app/storage/framework

x-common: &common
  <<: [*default-env, *laravel-volumes]

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-deploy-resources: &deploy-resources
  deploy:
    resources:
      limits:
        memory: 512M
      reservations:
        memory: 128M

name: danielpetrica_com_${APP_ENV}

services:
  danielpetrica_com:
    container_name: danielpetrica_com_web_${APP_ENV}
    image: homebrain.tailb7c9d.ts.net:3000/danielpetrica/danielpetrica.com/web:latest
    pull_policy: always
    <<: [*common, *deploy-resources]
    shm_size: '256M'
    stop_grace_period: 30s
    labels:
      - traefik.enable=true
      - traefik.http.routers.danielpetrica_com_${APP_ENV}-https.rule=Host(`${APP_DOMAIN}`)
      - traefik.http.routers.danielpetrica_com_${APP_ENV}-https.tls=true
      - traefik.http.services.danielpetrica_com_${APP_ENV}-https.loadbalancer.server.port=80
      - traefik.http.routers.danielpetrica_com_${APP_ENV}-https.tls.certresolver=cloudflare
      - traefik.http.routers.danielpetrica_com_${APP_ENV}-https.entrypoints=websecure
    environment:
      SERVER_NAME: ${APP_DOMAIN:-:80}
      SERVER_ROOT: /app/public
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - internal
      - traefik
    restart: unless-stopped
    healthcheck:
      test: [
        "CMD-SHELL",
        "response=$(curl -fsS http://127.0.0.1:80/up 2>&1) || { rc=$$?; echo \"[healthcheck] GET /up failed with code $$rc, response: $$response\" >&2; exit 1; }"
      ]
      interval: 40s
      timeout: 30s
      retries: 10
      start_period: 60s
    logging: *default-logging

  worker:
    container_name: danielpetrica_com_worker_${APP_ENV}
    image: homebrain.tailb7c9d.ts.net:3000/danielpetrica/danielpetrica.com/worker:latest
    pull_policy: always
    <<: *common
    command: ["php", "artisan", "horizon"]
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "php artisan about >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 2s
      retries: 10

  scheduler:
    container_name: danielpetrica_com_scheduler_${APP_ENV}
    image: homebrain.tailb7c9d.ts.net:3000/danielpetrica/danielpetrica.com/worker:latest
    pull_policy: always
    <<: *common
    command: ["php", "artisan", "schedule:work"]
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped
    logging: *default-logging

  nightwatch-agent:
    container_name: nightwatch-agent
    image: laravelphp/nightwatch-agent:v1
    environment:
      NIGHTWATCH_TOKEN: ${NIGHTWATCH_TOKEN}
      NIGHTWATCH_REQUEST_SAMPLE_RATE: ${NIGHTWATCH_REQUEST_SAMPLE_RATE:-0.1}
      NIGHTWATCH_IGNORE_CACHE_EVENTS: ${NIGHTWATCH_IGNORE_CACHE_EVENTS:-true}
    command: ["php", "artisan", "nightwatch:agent"]
    networks:
      - internal
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: php nightwatch-status
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  db:
    image: postgres:18
    container_name: danielpetrica_com_db_${APP_ENV}
    command: >
      postgres
      -c shared_buffers=128MB
      -c effective_cache_size=384MB
      -c max_connections=50
      -c wal_buffers=16MB
      -c max_wal_size=1GB
      -c checkpoint_timeout=15min
    logging: *default-logging
    env_file: .env
    environment:
      POSTGRES_DB: ${DB_DATABASE:-app}
      POSTGRES_USER: ${DB_USERNAME:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "127.0.0.1:${DB_EXPOSE_PORT:-15432}:5432"
    volumes:
      - ./.postgres-db/:/var/lib/postgresql
    networks:
      - internal
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-app}"]
      timeout: 20s
      retries: 10
      start_period: 30s
      interval: 10s

  redis:
    image: redis:alpine
    container_name: danielpetrica_com_redis_${APP_ENV}
    volumes:
      - redis-data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      start_period: 30s
      retries: 10
    restart: unless-stopped
    command: redis-server --save 3600 1 --save 300 10
    logging: *default-logging

  db_backup:
    image: tiredofit/db-backup
    container_name: db_backup_danielpetricacom_${APP_ENV}
    depends_on:
      - db
    volumes:
      - ../../backups/${APP_DOMAIN}/${APP_ENV}:/backup
    environment:
      - MODE=AUTO
      - DB01_TYPE=postgres
      - DB01_HOST=${DB_HOST:-db}
      - DB01_NAME=${DB_DATABASE}
      - DB01_USER=${DB_USERNAME:-app}
      - DB01_PASS=${DB_PASSWORD}
      - DB01_BACKUP_BEGIN=+0
      - DB01_BACKUP_INTERVAL=1440
      - DB01_CLEANUP_TIME=10080
      - DB01_COMPRESSION=ZSTD
      - DB01_COMPRESSION_LEVEL=3
      - DB01_ENABLE_PARALLEL_COMPRESSION=TRUE
      - DB01_CHECKSUM=MD5
    networks:
      - internal
    restart: always
    logging: *default-logging

volumes:
  redis-data:

networks:
  internal:
  traefik:
    external: true
    name: traefik
