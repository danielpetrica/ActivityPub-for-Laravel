# Crow CI for danielpetrica/activitypub-for-laravel (a Laravel package: no
# Docker image, no deploy — just tests, static analysis and code style).
labels:
  agent: nec-server
  dc: tokyo

when:
  - event: push
    ref: refs/heads/main
  - event: pull_request
  - event: manual

# Build cache — https://docs.crowci.com/v6-12/usage/caching/
#
# This workflow only needs Composer: vendor/ plus the Composer download cache,
# keyed on composer.lock. restore_keys falls back to the newest cache of the
# same kind, so a changed lockfile still reuses the download cache.
#
# Cold start: the first run after the server enables caching misses and only
# saves; the speedup starts with the second run.
cache:
  - key: composer-{{ checksum "composer.lock" }}
    restore_keys: [composer-]
    paths: [vendor, .cache/composer]

steps:
  # The cache plugin restores files as root. serversideup/php runs steps as
  # www-data (uid 82 in the alpine variant), so composer install would fail
  # with "Permission denied" writing vendor/pest-plugins.json. Hand the
  # restored trees to the step user first. A cold run has nothing to chown,
  # hence the `|| true`.
  - name: fix-cache-ownership
    image: alpine:3.22
    commands:
      - chown -R 82:82 vendor .cache 2>/dev/null || true

  - name: composer-install
    image: serversideup/php:8.5-cli-alpine
    environment:
      # Keep the Composer download cache inside the workspace so the `cache`
      # section above can restore it.
      COMPOSER_CACHE_DIR: ${CI_WORKSPACE}/.cache/composer
    commands:
      - composer install --prefer-dist --no-interaction --no-progress
    depends_on:
      - fix-cache-ownership

  - name: tests
    image: serversideup/php:8.5-cli-alpine
    commands:
      - vendor/bin/pest
    depends_on:
      - composer-install

  - name: phpstan
    image: serversideup/php:8.5-cli-alpine
    commands:
      - vendor/bin/phpstan analyse --no-progress --memory-limit=1G
    depends_on:
      - composer-install

  - name: pint
    image: serversideup/php:8.5-cli-alpine
    commands:
      - |
        if [ -f vendor/bin/pint ]; then
          vendor/bin/pint --test
        else
          echo "laravel/pint is not installed; skipping formatter check."
        fi
    depends_on:
      - composer-install
