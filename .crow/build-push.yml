  - name: manifest
    image: docker:28
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      ORG_USERNAME_DOCKER:
        from_secret: org_username_docker
      ORG_TOKEN_DOCKER:
        from_secret: org_token_docker
    commands:
      - |
        REGISTRY=forgejo.tailb7c9d.ts.net
        REPO=daniel_org/danielpetrica.com
        echo "$ORG_TOKEN_DOCKER" | docker login $REGISTRY --username "$ORG_USERNAME_DOCKER" --password-stdin
        for IMAGE in web worker; do
          docker buildx imagetools create \
            --tag "$REGISTRY/$REPO:$IMAGE" \
            "$REGISTRY/$REPO:$IMAGE-amd64" \
            "$REGISTRY/$REPO:$IMAGE-arm64"

          if [ -n "$CI_COMMIT_TAG" ]; then
            docker buildx imagetools create \
              --tag "$REGISTRY/$REPO:$IMAGE-$CI_COMMIT_TAG" \
              "$REGISTRY/$REPO:$IMAGE-amd64-$CI_COMMIT_TAG" \
              "$REGISTRY/$REPO:$IMAGE-arm64-$CI_COMMIT_TAG"
          fi
        done
    depends_on:
      - build-web-amd64
      - build-web-arm64
      - build-worker-amd64
      - build-worker-arm64

  - name: deploy
    image: alpine
    when:
      - event: tag
        ref: 'refs/tags/v*'
    environment:
      DEPLOY_HOST:
        from_secret: DEPLOY_HOST
      DEPLOY_SSH_KEY:
        from_secret: DEPLOY_SSH_KEY
    commands:
      - apk add --no-cache openssh-client
      - mkdir -p ~/.ssh
      - echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
      - chmod 600 ~/.ssh/deploy_key
      - ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key "ubuntu@$DEPLOY_HOST" "cd /home/ubuntu/traefik/danielpetrica/prod && ./deploy.sh"
    depends_on:
      - manifest
