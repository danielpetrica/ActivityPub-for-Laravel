labels:
  agent: nec-server
  dc: tokyo

when:
  - event: tag
    ref: 'refs/tags/v*'
  - event: manual

steps:
  - name: prepare-env
    image: alpine
    commands:
      # Frontend assets are built inside the Dockerfile (assets stage), so this
      # step only writes the minimal .env the image build needs (composer
      # install + package:discover run with APP_ENV=production).
      - |
        cat > .env << 'EOF'
        APP_ENV=production
        APP_KEY=base64:dummykeyforbuildpurposesonly
        APP_DEBUG=false
        APP_URL=http://localhost
        DB_CONNECTION=sqlite
        SESSION_DRIVER=database
        CACHE_STORE=database
        QUEUE_CONNECTION=database
        REDIS_CLIENT=predis
        LOG_CHANNEL=stack
        LOG_LEVEL=error
        EOF

  - name: build-and-push-web-amd64
    image: codefloe.com/crow-plugins/docker-buildx
    privileged: true
    settings:
      registry: forgejo.tailb7c9d.ts.net
      repo: forgejo.tailb7c9d.ts.net/daniel_org/danielpetrica.com
      tags:
        - web-amd64
      target: frankenphp
      platforms: linux/amd64
      cache_images:
        - forgejo.tailb7c9d.ts.net/daniel_org/danielpetrica.com:web-amd64-cache
      username:
        from_secret: org_username_docker
      password:
        from_secret: org_token_docker
    depends_on:
      - prepare-env

  - name: build-and-push-web-arm64
    image: codefloe.com/crow-plugins/docker-buildx
    privileged: true
    settings:
      registry: forgejo.tailb7c9d.ts.net
      repo: forgejo.tailb7c9d.ts.net/daniel_org/danielpetrica.com
      tags:
        - web-arm64
      target: frankenphp
      platforms: linux/arm64
      cache_images:
        - forgejo.tailb7c9d.ts.net/daniel_org/danielpetrica.com:web-arm64-cache
      username:
        from_secret: org_username_docker
      password:
        from_secret: org_token_docker
    depends_on:
      - prepare-env

  - name: build-and-push-worker-amd64
    image: codefloe.com/crow-plugins/docker-buildx
    privileged: true
    settings:
      registry: forgejo.tailb7c9d.ts.net
      repo: forgejo.tailb7c9d.ts.net/daniel_org/danielpetrica.com
      tags:
        - worker-amd64
      target: worker
      platforms: linux/amd64
      cache_images:
        - forgejo.tailb7c9d.ts.net/daniel_org/danielpetrica.com:worker-amd64-cache
      username:
        from_secret: org_username_docker
      password:
        from_secret: org_token_docker
    depends_on:
      - prepare-env

  - name: build-and-push-worker-arm64
    image: codefloe.com/crow-plugins/docker-buildx
    privileged: true
    settings:
      registry: forgejo.tailb7c9d.ts.net
      repo: forgejo.tailb7c9d.ts.net/daniel_org/danielpetrica.com
      tags:
        - worker-arm64
      target: worker
      platforms: linux/arm64
      cache_images:
        - forgejo.tailb7c9d.ts.net/daniel_org/danielpetrica.com:worker-arm64-cache
      username:
        from_secret: org_username_docker
      password:
        from_secret: org_token_docker
    depends_on:
      - prepare-env

  - name: merge-web-manifest
    image: alpine
    commands:
      - apk add --no-cache docker-cli docker-cli-buildx
      - echo "$ORG_TOKEN_DOCKER" | docker login forgejo.tailb7c9d.ts.net -u "$ORG_USERNAME_DOCKER" --password-stdin
      - docker buildx imagetools create -t forgejo.tailb7c9d.ts.net/daniel_org/danielpetrica.com:web forgejo.tailb7c9d.ts.net/daniel_org/danielpetrica.com:web-amd64 forgejo.tailb7c9d.ts.net/daniel_org/danielpetrica.com:web-arm64
    environment:
      ORG_USERNAME_DOCKER:
        from_secret: org_username_docker
      ORG_TOKEN_DOCKER:
        from_secret: org_token_docker
    depends_on:
      - build-and-push-web-amd64
      - build-and-push-web-arm64

  - name: merge-worker-manifest
    image: alpine
    commands:
      - apk add --no-cache docker-cli docker-cli-buildx
      - echo "$ORG_TOKEN_DOCKER" | docker login forgejo.tailb7c9d.ts.net -u "$ORG_USERNAME_DOCKER" --password-stdin
      - docker buildx imagetools create -t forgejo.tailb7c9d.ts.net/daniel_org/danielpetrica.com:worker forgejo.tailb7c9d.ts.net/daniel_org/danielpetrica.com:worker-amd64 forgejo.tailb7c9d.ts.net/daniel_org/danielpetrica.com:worker-arm64
    environment:
      ORG_USERNAME_DOCKER:
        from_secret: org_username_docker
      ORG_TOKEN_DOCKER:
        from_secret: org_token_docker
    depends_on:
      - build-and-push-worker-amd64
      - build-and-push-worker-arm64

  - name: deploy
    image: alpine
    when:
      - event: tag
        ref: 'refs/tags/v*'
    environment:
      DEPLOY_HOST:
        from_secret: DEPLOY_HOST
      DEPLOY_SSH_KEY:
        from_secret: DEPLOY_SSH_KEY
    commands:
      - apk add --no-cache openssh-client
      - mkdir -p ~/.ssh
      - echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
      - chmod 600 ~/.ssh/deploy_key
      - ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key "ubuntu@$DEPLOY_HOST" "cd /home/ubuntu/traefik/danielpetrica/prod && ./deploy.sh"
    depends_on:
      - merge-web-manifest
      - merge-worker-manifest