labels:
  agent: unraid-agent

when:
  - event: tag
    ref: 'refs/tags/v*'
  - event: manual

steps:
  - name: prepare-assets
    image: node:22-alpine
    environment:
      NODE_ENV: production
    commands:
      - corepack enable
      - corepack prepare yarn@1.22.22 --activate
      - yarn install --frozen-lockfile
      - yarn build

  - name: build-web-amd64
    image: docker:28
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      ORG_USERNAME_DOCKER:
        from_secret: org_username_docker
      ORG_TOKEN_DOCKER:
        from_secret: org_token_docker
      FILAMENT_TOKEN:
        from_secret: FILAMENT_TOKEN
    commands:
      - echo "$ORG_TOKEN_DOCKER" | docker login forgejo.tailb7c9d.ts.net --username "$ORG_USERNAME_DOCKER" --password-stdin
      - docker buildx create --use --driver-opt network=host || true
      - |
        cat > .env << 'EOF'
        APP_ENV=production
        APP_KEY=base64:dummykeyforbuildpurposesonly
        APP_DEBUG=false
        APP_URL=http://localhost
        DB_CONNECTION=sqlite
        SESSION_DRIVER=database
        CACHE_STORE=database
        QUEUE_CONNECTION=database
        REDIS_CLIENT=predis
        LOG_CHANNEL=stack
        LOG_LEVEL=error
        EOF
      - cp .env .env.production
      - |
        printf '{"http-basic":{"packages.filamentphp.com":{"username":"andrei@danielpetrica.com","password":"%s"}}}' "$FILAMENT_TOKEN" > /tmp/composer_auth.json
      - |
        TAG_ARGS="-t forgejo.tailb7c9d.ts.net/daniel_org/danielpetrica.com:web-amd64"
        if [ -n "$CI_COMMIT_TAG" ]; then
          TAG_ARGS="$TAG_ARGS -t forgejo.tailb7c9d.ts.net/daniel_org/danielpetrica.com:web-amd64-$CI_COMMIT_TAG"
        fi
        docker buildx build \
          --platform linux/amd64 \
          --target frankenphp \
          --secret id=composer_auth,src=/tmp/composer_auth.json \
          --cache-from type=registry,ref=forgejo.tailb7c9d.ts.net/daniel_org/danielpetrica.com:web-amd64,image-manifest=true \
          --cache-from type=registry,ref=forgejo.tailb7c9d.ts.net/daniel_org/danielpetrica.com:web-amd64-buildcache,image-manifest=true \
          --cache-to type=registry,ref=forgejo.tailb7c9d.ts.net/daniel_org/danielpetrica.com:web-amd64-buildcache,mode=min \
          $TAG_ARGS \
          --push \
          .
    depends_on:
      - prepare-assets

  - name: build-web-arm64
    image: docker:28
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      ORG_USERNAME_DOCKER:
        from_secret: org_username_docker
      ORG_TOKEN_DOCKER:
        from_secret: org_token_docker
      FILAMENT_TOKEN:
        from_secret: FILAMENT_TOKEN
    commands:
      - echo "$ORG_TOKEN_DOCKER" | docker login forgejo.tailb7c9d.ts.net --username "$ORG_USERNAME_DOCKER" --password-stdin
      - docker buildx create --use --driver-opt network=host || true
      - |
        cat > .env << 'EOF'
        APP_ENV=production
        APP_KEY=base64:dummykeyforbuildpurposesonly
        APP_DEBUG=false
        APP_URL=http://localhost
        DB_CONNECTION=sqlite
        SESSION_DRIVER=database
        CACHE_STORE=database
        QUEUE_CONNECTION=database
        REDIS_CLIENT=predis
        LOG_CHANNEL=stack
        LOG_LEVEL=error
        EOF
      - cp .env .env.production
      - |
        printf '{"http-basic":{"packages.filamentphp.com":{"username":"andrei@danielpetrica.com","password":"%s"}}}' "$FILAMENT_TOKEN" > /tmp/composer_auth.json
      - |
        TAG_ARGS="-t forgejo.tailb7c9d.ts.net/daniel_org/danielpetrica.com:web-arm64"
        if [ -n "$CI_COMMIT_TAG" ]; then
          TAG_ARGS="$TAG_ARGS -t forgejo.tailb7c9d.ts.net/daniel_org/danielpetrica.com:web-arm64-$CI_COMMIT_TAG"
        fi
        docker buildx build \
          --platform linux/arm64 \
          --target frankenphp \
          --secret id=composer_auth,src=/tmp/composer_auth.json \
          --cache-from type=registry,ref=forgejo.tailb7c9d.ts.net/daniel_org/danielpetrica.com:web-arm64,image-manifest=true \
          --cache-from type=registry,ref=forgejo.tailb7c9d.ts.net/daniel_org/danielpetrica.com:web-arm64-buildcache,image-manifest=true \
          --cache-to type=registry,ref=forgejo.tailb7c9d.ts.net/daniel_org/danielpetrica.com:web-arm64-buildcache,mode=min \
          $TAG_ARGS \
          --push \
          .
    depends_on:
      - prepare-assets

  - name: build-worker-amd64
