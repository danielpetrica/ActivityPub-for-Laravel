labels:
  agent: nec-server
  dc: tokyo

when:
  - event: tag
    ref: 'refs/tags/v*'
  - event: manual

steps:
  - name: prepare-env
    image: alpine
    commands:
      # Frontend assets are built inside the Dockerfile (assets stage), so this
      # step only writes the minimal .env the image build needs (composer
      # install + package:discover run with APP_ENV=production).
      - |
        cat > .env << 'EOF'
        APP_ENV=production
        APP_KEY=base64:dummykeyforbuildpurposesonly
        APP_DEBUG=false
        APP_URL=http://localhost
        DB_CONNECTION=sqlite
        SESSION_DRIVER=database
        CACHE_STORE=database
        QUEUE_CONNECTION=database
        REDIS_CLIENT=predis
        LOG_CHANNEL=stack
        LOG_LEVEL=error
        EOF

  - name: build-and-push-web
    image: codefloe.com/crow-plugins/docker-buildx
    privileged: true
    settings:
      registry: forgejo.tailb7c9d.ts.net
      repo: forgejo.tailb7c9d.ts.net/daniel_org/danielpetrica.com
      target: frankenphp
      platforms: linux/amd64,linux/arm64
      auto_tag: true
      cache_images:
        - forgejo.tailb7c9d.ts.net/daniel_org/danielpetrica.com:web-cache
      username:
        from_secret: org_username_docker
      password:
        from_secret: org_token_docker
    depends_on:
      - prepare-env

  - name: build-and-push-worker
    image: codefloe.com/crow-plugins/docker-buildx
    privileged: true
    settings:
      registry: forgejo.tailb7c9d.ts.net
      repo: forgejo.tailb7c9d.ts.net/daniel_org/danielpetrica.com
      target: worker
      platforms: linux/amd64,linux/arm64
      auto_tag: true
      cache_images:
        - forgejo.tailb7c9d.ts.net/daniel_org/danielpetrica.com:worker-cache
      username:
        from_secret: org_username_docker
      password:
        from_secret: org_token_docker
    depends_on:
      - prepare-env

  - name: deploy
    image: alpine
    when:
      - event: tag
        ref: 'refs/tags/v*'
    environment:
      DEPLOY_HOST:
        from_secret: DEPLOY_HOST
      DEPLOY_SSH_KEY:
        from_secret: DEPLOY_SSH_KEY
    commands:
      - apk add --no-cache openssh-client
      - mkdir -p ~/.ssh
      - echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
      - chmod 600 ~/.ssh/deploy_key
      - ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key "ubuntu@$DEPLOY_HOST" "cd /home/ubuntu/traefik/danielpetrica/prod && ./deploy.sh"
    depends_on:
      - build-and-push-web
      - build-and-push-worker
