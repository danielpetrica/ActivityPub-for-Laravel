    environment:
      ORG_USERNAME_DOCKER:
        from_secret: org_username_docker
      ORG_TOKEN_DOCKER:
        from_secret: org_token_docker
      FILAMENT_TOKEN:
        from_secret: FILAMENT_TOKEN
    commands:
      - echo "$ORG_TOKEN_DOCKER" | docker login forgejo.tailb7c9d.ts.net --username "$ORG_USERNAME_DOCKER" --password-stdin
      - docker buildx create --use --driver-opt network=host || true
      - |
        cat > .env << 'EOF'
        APP_ENV=production
        APP_KEY=base64:dummykeyforbuildpurposesonly
        APP_DEBUG=false
        APP_URL=http://localhost
        DB_CONNECTION=sqlite
        SESSION_DRIVER=database
        CACHE_STORE=database
        QUEUE_CONNECTION=database
        REDIS_CLIENT=predis
        LOG_CHANNEL=stack
        LOG_LEVEL=error
        EOF
      - cp .env .env.production
      - |
        printf '{"http-basic":{"packages.filamentphp.com":{"username":"andrei@danielpetrica.com","password":"%s"}}}' "$FILAMENT_TOKEN" > /tmp/composer_auth.json
      - |
        TAG_ARGS="-t forgejo.tailb7c9d.ts.net/daniel_org/danielpetrica.com:worker-arm64"
        if [ -n "$CI_COMMIT_TAG" ]; then
          TAG_ARGS="$TAG_ARGS -t forgejo.tailb7c9d.ts.net/daniel_org/danielpetrica.com:worker-arm64-$CI_COMMIT_TAG"
        fi
        docker buildx build \
          --platform linux/arm64 \
          --target worker \
          --secret id=composer_auth,src=/tmp/composer_auth.json \
          --cache-from type=registry,ref=forgejo.tailb7c9d.ts.net/daniel_org/danielpetrica.com:worker-arm64,image-manifest=true \
          --cache-from type=registry,ref=forgejo.tailb7c9d.ts.net/daniel_org/danielpetrica.com:worker-arm64-buildcache,image-manifest=true \
          --cache-to type=registry,ref=forgejo.tailb7c9d.ts.net/daniel_org/danielpetrica.com:worker-arm64-buildcache,mode=min \
          $TAG_ARGS \
          --push \
          .
    depends_on:
      - prepare-assets

  - name: manifest
    image: docker:28
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      ORG_USERNAME_DOCKER:
        from_secret: org_username_docker
      ORG_TOKEN_DOCKER:
        from_secret: org_token_docker
    commands:
      - echo "$ORG_TOKEN_DOCKER" | docker login forgejo.tailb7c9d.ts.net --username "$ORG_USERNAME_DOCKER" --password-stdin
      - |
        for IMAGE in web worker; do
          docker buildx imagetools create \
            --tag "forgejo.tailb7c9d.ts.net/daniel_org/danielpetrica.com:$IMAGE" \
            "forgejo.tailb7c9d.ts.net/daniel_org/danielpetrica.com:$IMAGE-amd64" \
            "forgejo.tailb7c9d.ts.net/daniel_org/danielpetrica.com:$IMAGE-arm64"

          if [ -n "$CI_COMMIT_TAG" ]; then
            docker buildx imagetools create \
              --tag "forgejo.tailb7c9d.ts.net/daniel_org/danielpetrica.com:$IMAGE-$CI_COMMIT_TAG" \
              "forgejo.tailb7c9d.ts.net/daniel_org/danielpetrica.com:$IMAGE-amd64-$CI_COMMIT_TAG" \
              "forgejo.tailb7c9d.ts.net/daniel_org/danielpetrica.com:$IMAGE-arm64-$CI_COMMIT_TAG"
          fi
        done
    depends_on:
      - build-web-amd64
      - build-web-arm64
      - build-worker-amd64
      - build-worker-arm64

  - name: deploy
    image: alpine
    when:
      - event: tag
        ref: 'refs/tags/v*'
    environment:
      DEPLOY_HOST:
        from_secret: DEPLOY_HOST
      DEPLOY_SSH_KEY:
        from_secret: DEPLOY_SSH_KEY
    commands:
      - apk add --no-cache openssh-client
      - mkdir -p ~/.ssh
      - echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
      - chmod 600 ~/.ssh/deploy_key
      - ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key "ubuntu@$DEPLOY_HOST" "cd /home/ubuntu/traefik/danielpetrica/prod && ./deploy.sh"
    depends_on:
      - manifest
